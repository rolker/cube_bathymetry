name: CI

on:
  push:
    branches: [jazzy]
  pull_request:
    branches: [jazzy]

jobs:
  industrial_ci:
    name: ROS 2 Jazzy (industrial_ci)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read   # pull the prebaked CI dep image from GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate to GHCR so industrial_ci can pull the prebaked dependency
      # image (DOCKER_IMAGE below). The image is built + pushed by ci-image.yml.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Persist the ccache across runs so unchanged upstream packages
      # (unh_marine_autonomy, mru_transform, ...) recompile near-incrementally
      # instead of from scratch. Keyed per-commit, restored from any prior run.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-jazzy-${{ github.sha }}
          restore-keys: |
            ccache-jazzy-

      # ros-industrial/industrial_ci runs the full ROS pipeline in a container:
      # rosdep resolve -> build the upstream workspace + this package -> colcon
      # test (incl. the ament linters). The same invocation reproduces locally
      # (`run_ci` / .ci entrypoint), so CI lint versions can be matched on a dev
      # machine before pushing.
      - name: industrial_ci
        uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: jazzy
          ROS_REPO: main
          # Prebaked dependency image (Tier C, deps-only): the rosdep system
          # deps for cube + its upstream workspace are baked in, so this run
          # skips the apt dependency install. Built + pushed by ci-image.yml;
          # see .github/ci/Dockerfile. CI still clones + builds the upstream
          # sources every run (with ccache), so the image never goes stale
          # w.r.t. source. DOCKER_PULL keeps the baked deps current.
          DOCKER_IMAGE: ghcr.io/${{ github.repository_owner }}/cube_bathymetry-ci:jazzy
          DOCKER_PULL: "true"
          # Unreleased source deps, cloned by industrial_ci into the upstream
          # workspace (replaces the manual git-clone step).
          UPSTREAM_WORKSPACE: upstream.repos
          # Activates ccache inside industrial_ci's build.
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          # --- Prune cube's subtree out of the monorepo (see #72/#76) ------
          # industrial_ci resolves + builds the WHOLE unh_marine_autonomy
          # monorepo, unlike the old `rosdep -r` + `--packages-up-to` flow that
          # only touched cube's subtree. Several monorepo packages are outside
          # cube_bathymetry's build graph, so we prune them deliberately with
          # COLCON_IGNORE (below) — cube CI should not compile packages it never
          # ships. Two of those, mission_manager* and the integration-tests,
          # also declare marine_nav_* source deps; rosdep does not honor
          # COLCON_IGNORE, so it still reads their package.xml and would fail on
          # those keys — hence marine_nav_* stays in ROSDEP_SKIP_KEYS even though
          # the packages are never built. (marine_mbes_backscatter_store used to
          # be pruned here purely for scope; cube#80 added a real
          # `<depend>marine_mbes_backscatter_store</depend>`, so it is now built
          # in upstream_ws like marine_bathymetry_store — no skip-key needed, it
          # has no marine_nav dep.) This is intentional scoping, NOT a pending
          # workaround — the one real upstream bug here, the invalid nlohmann_json
          # rosdep key, is fixed in unh_marine_autonomy#228, so nothing waits on
          # upstream.
          # (Option A — clone unh_marine_navigation + build the whole monorepo —
          # was considered in #76 and rejected: no benefit to cube correctness.)
          ROSDEP_SKIP_KEYS: "marine_nav_interfaces marine_nav_tasks"
          AFTER_SETUP_UPSTREAM_WORKSPACE: 'for p in mission_manager mission_manager_interfaces marine_autonomy_integration_tests; do find /root/upstream_ws/src -type d -name "$p" -exec touch {}/COLCON_IGNORE \; ; done'
