name: CI dependency image

# Builds + pushes the prebaked CI dependency image (.github/ci/Dockerfile) to
# GHCR. The per-PR CI workflow (ci.yml) consumes it via DOCKER_IMAGE to skip
# the apt dependency install. See .github/ci/Dockerfile for the deps-only
# rationale.

on:
  # Weekly rebuild keeps the baked system deps fresh (new apt versions, deps
  # added upstream since the last build). The CI-time rosdep install covers the
  # gap between rebuilds, so the cadence is not load-bearing.
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
  # Rebuild immediately when the recipe or the dep inputs change.
  push:
    branches: [jazzy]
    paths:
      - '.github/ci/Dockerfile'
      - '.github/workflows/ci-image.yml'
      - 'upstream.repos'
      - 'cube_bathymetry/package.xml'

jobs:
  build-and-push:
    name: Build + push to GHCR
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/ci/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cube_bathymetry-ci:jazzy
